trigger:
  branches:
    include:
      - feature/newrg
      - main

pr:
  branches:
    include:
      - main

pool:
  name: vishu_agent   # aapka self-hosted agent pool

variables:
  terraformWorkingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
  terraformVersion: '1.9.8'
  serviceConnection: 'vishu-azure-terraform-connection'

stages:

  # ==================================================
  # Terraform Plan / Validation
  # ==================================================
  - stage: TerraformPlan
    displayName: 'Terraform Plan'
    jobs:
      - job: Plan
        displayName: 'Terraform Plan'
        steps:

          # -----------------------------
          # Checkout
          # -----------------------------
          - checkout: self
            fetchDepth: 0

          # -----------------------------
          # Setup Terraform
          # -----------------------------
          - task: TerraformInstaller@1
            displayName: 'Setup Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          # -----------------------------
          # Setup + Init TFLint
          # -----------------------------
          - script: |
              curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
              tflint --init
            displayName: 'Setup & Initialize TFLint'
            workingDirectory: '$(terraformWorkingDirectory)'

          # -----------------------------
          # TFLint Scan
          # -----------------------------
          - script: tflint
            displayName: 'Run TFLint'
            workingDirectory: '$(terraformWorkingDirectory)'

          # -----------------------------
          # Gitleaks
          # -----------------------------
          - script: |
              curl -sSL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.18.4_linux_x64.tar.gz -o gitleaks.tar.gz
              tar -xzf gitleaks.tar.gz
              ./gitleaks detect --source=. --no-git -v
            displayName: 'Run Gitleaks'
            workingDirectory: '$(System.DefaultWorkingDirectory)'

          # -----------------------------
          # Azure Login Check (via service connection)
          # -----------------------------
          - task: AzureCLI@2
            displayName: 'Azure Login Check'
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: 'az account show'

          # -----------------------------
          # Terraform Init
          # -----------------------------
          - task: AzureCLI@2
            displayName: 'Terraform Init'
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                terraform init
              workingDirectory: '$(terraformWorkingDirectory)'

          # -----------------------------
          # Terraform Format Check
          # -----------------------------
          - script: terraform fmt -check
            displayName: 'Terraform Format Check'
            workingDirectory: '$(terraformWorkingDirectory)'

          # -----------------------------
          # Terraform Validate
          # -----------------------------
          - script: terraform validate
            displayName: 'Terraform Validate'
            workingDirectory: '$(terraformWorkingDirectory)'

          # -----------------------------
          # Terraform Plan
          # -----------------------------
          - task: AzureCLI@2
            displayName: 'Terraform Plan'
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                terraform plan
              workingDirectory: '$(terraformWorkingDirectory)'

  # ==================================================
  # Terraform Apply (only on main branch push, not PR)
  # ==================================================
  - stage: TerraformApply
    displayName: 'Terraform Apply'
    dependsOn: TerraformPlan
    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    jobs:
      - job: Apply
        displayName: 'Terraform Apply'
        steps:

          # -----------------------------
          # Checkout
          # -----------------------------
          - checkout: self

          # -----------------------------
          # Setup Terraform
          # -----------------------------
          - task: TerraformInstaller@1
            displayName: 'Setup Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          # -----------------------------
          # Terraform Init
          # -----------------------------
          - task: AzureCLI@2
            displayName: 'Terraform Init'
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                terraform init
              workingDirectory: '$(terraformWorkingDirectory)'

          # -----------------------------
          # Terraform Apply
          # -----------------------------
          - task: AzureCLI@2
            displayName: 'Terraform Apply'
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              inlineScript: |
                export ARM_CLIENT_ID=$servicePrincipalId
                export ARM_CLIENT_SECRET=$servicePrincipalKey
                export ARM_TENANT_ID=$tenantId
                export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                terraform apply -auto-approve
              workingDirectory: '$(terraformWorkingDirectory)'